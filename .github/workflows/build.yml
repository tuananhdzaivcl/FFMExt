name: Build FFMExt

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download SDKs
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mkdir -p $HOME/theos/sdks
          cp -a sdks-master/iPhoneOS*.sdk $HOME/theos/sdks/ || true

      - name: Build package
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r .theos/_/Applications/FFMExt.app Payload/
          zip -r FFMExt.ipa Payload

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFMExt-deb
          path: packages/*.deb

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFMExt-ipa
          path: FFMExt.ipa