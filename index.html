<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0818">
<title>Hộp quà Bảng tuần hoàn</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0a0818;color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{background:
 radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent 51%),
 radial-gradient(1px 1px at 78% 12%,#fff7 50%,transparent 51%),
 radial-gradient(1.5px 1.5px at 88% 64%,#fff6 50%,transparent 51%),
 radial-gradient(1px 1px at 22% 82%,#fff7 50%,transparent 51%),
 radial-gradient(1px 1px at 52% 90%,#fff5 50%,transparent 51%),
 radial-gradient(ellipse at 50% 45%,#231a52 0%,#0a0818 72%)}
#stage{position:fixed;inset:0;perspective:900px;perspective-origin:50% 45%;overflow:hidden;touch-action:none;cursor:pointer}
.anchor{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}

/* ---------- Hộp quà ---------- */
#boxwrap{transition:opacity .9s,transform .9s}
#boxwrap.gone{opacity:0;transform:translateY(40px) scale(.7);pointer-events:none}
#tilt{position:absolute;width:var(--s);height:var(--s);left:calc(var(--s)/-2);top:calc(var(--s)/-2);transform-style:preserve-3d}
.body{--h:calc(var(--s)/2);position:absolute;left:0;top:calc(var(--s)*.3);width:var(--s);height:calc(var(--s)*.7);transform-style:preserve-3d}
.lid{--h:calc(var(--s)*.525);position:absolute;left:calc(var(--s)*-.025);top:0;width:calc(var(--s)*1.05);height:calc(var(--s)*.3);
 transform-style:preserve-3d;transform-origin:50% 100% calc(var(--s)*-.525);transition:transform 1s cubic-bezier(.3,1.35,.5,1)}
.lid.open{transform:translateY(-4px) rotateX(115deg)}
.f{position:absolute;left:0;top:0;width:100%;height:100%;border:1px solid #ffffff22}
.fr{transform:translateZ(var(--h))}
.bk{transform:rotateY(180deg) translateZ(var(--h))}
.lf{transform:rotateY(-90deg) translateZ(var(--h))}
.rt{transform:rotateY(90deg) translateZ(var(--h))}
.body .f{--rb:linear-gradient(90deg,transparent 42%,#ffd24a 42%,#ffd24a 58%,transparent 58%);background:var(--rb),linear-gradient(#d4194f,#8f0d35)}
.lid .f{background:linear-gradient(90deg,transparent 42%,#ffd24a 42%,#ffd24a 58%,transparent 58%),linear-gradient(#ee3a70,#c2154a)}
.body .floor{height:var(--s);top:calc(var(--s)*-.15);transform:rotateX(-90deg) translateZ(calc(var(--s)*.35 - 4px));
 background:radial-gradient(circle,#fff7cf 0%,#ffb347 45%,#7a1030 100%)}
.lid .top{height:calc(var(--s)*1.05);top:calc(var(--s)*-.375);transform:rotateX(90deg) translateZ(calc(var(--s)*.15));
 background:linear-gradient(90deg,transparent 42%,#ffd24a 42%,#ffd24a 58%,transparent 58%),linear-gradient(transparent 42%,#ffd24a 42%,#ffd24a 58%,transparent 58%),linear-gradient(#f2467a,#d11c55)}
.top::before,.top::after{content:"";position:absolute;left:50%;top:50%;width:34%;height:15%;border:calc(var(--s)*.03) solid #ffd24a;border-radius:50%}
.top::before{transform:translate(-100%,-50%) rotate(-30deg)}
.top::after{transform:translate(0,-50%) rotate(30deg)}
#flash{position:absolute;left:50%;top:50%;width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;border-radius:50%;pointer-events:none;opacity:0;
 background:radial-gradient(circle,#fff0b0d9,#ffa03c40 40%,transparent 70%)}
#flash.on{animation:fl 1.8s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}

/* ---------- Nguyên tố ---------- */
#world{transform-style:preserve-3d}
.el{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;border-radius:12%;color:#fff;font-weight:700;
 backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform;transform:scale(0)}
.el b{font-weight:700;line-height:1;margin-top:-6%}
.el i{position:absolute;left:8%;top:5%;font-style:normal;font-weight:400;opacity:.85;line-height:1}
.el u{position:absolute;left:0;right:0;bottom:5%;text-align:center;text-decoration:none;font-weight:400;opacity:.9;line-height:1;white-space:nowrap}
.dec{position:absolute;left:0;top:0;opacity:0;pointer-events:none;will-change:transform,opacity}
.lb{display:flex;align-items:center;justify-content:center;color:#ffd98a;font-weight:700}
.lg{font-size:13px;line-height:1.25;padding:6px 9px;border:1px solid #ffffff30;border-radius:10px;background:#ffffff0d;color:#fff}
.lg h4{margin:0;font-size:13px;color:#ffe9a8}
.lg p{margin:0 0 4px;font-size:11px;opacity:.8}
.lg div{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 6px}
.lg span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.lg s{width:12px;height:12px;border-radius:3px;flex:none}

/* ---------- Giao diện ---------- */
#title{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;font-size:15px;letter-spacing:.14em;color:#ffe9a8;opacity:.85;pointer-events:none;font-weight:700}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:13px;color:#fff;pointer-events:none;transition:opacity .6s;padding:0 20px}
#hint span{display:inline-block;padding:9px 18px;border-radius:99px;background:#ffffff18;border:1px solid #ffffff30;animation:pulse 1.8s ease-in-out infinite}
#hint.hide{opacity:0}
@keyframes pulse{50%{transform:scale(1.06);background:#ffffff2a}}
#snd{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 8px);width:44px;height:44px;border-radius:50%;
 border:1px solid #ffffff35;background:#ffffff14;color:#fff;font-size:20px;line-height:1;z-index:5;cursor:pointer}
#sub{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 36px);text-align:center;font-size:13px;color:#fff;opacity:.8;pointer-events:none}
#big{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:60vmin;font-weight:900;line-height:1;color:#ffd24a;opacity:0;pointer-events:none}
#big.tick{animation:tick 1s ease-out}
@keyframes tick{0%{opacity:.42;transform:translateY(-50%) scale(1.18)}100%{opacity:.1;transform:translateY(-50%) scale(.95)}}
#zoom{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 58px);width:44px;height:44px;border-radius:50%;
 border:1px solid #ffffff35;background:#ffffff14;color:#fff;font-size:19px;line-height:1;z-index:5;cursor:pointer;display:none}
#zoom.show{display:block}#zoom.on{background:#ffd24a55;border-color:#ffd24a}
#rose{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity 1.3s;
 background:radial-gradient(ellipse at 50% 38%,#4d1029 0%,#1b0511 55%,#07010a 100%)}
#rose.on{opacity:1;pointer-events:auto}
#rc{position:absolute;inset:0;width:100%;height:100%}
#rtxt{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;font:italic 24px Georgia,"Times New Roman",serif;color:#ffd9a0;letter-spacing:.04em;opacity:0;transition:opacity 1.5s}
#again{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);padding:10px 20px;border-radius:99px;border:1px solid #ffffff40;background:#ffffff18;color:#fff;font-size:15px;opacity:0;transition:opacity 1.5s;cursor:pointer}
#rtxt.show,#again.show{opacity:1}
@media (prefers-reduced-motion:reduce){#hint span{animation:none}}
</style>
</head>
<body>
<audio id="bgm" src="music.mp3" loop preload="auto" playsinline></audio>
<div id="big"></div>
<div id="title">BẢNG TUẦN HOÀN</div>
<div id="sub"></div>
<button id="snd" aria-label="Bật/tắt nhạc">🔊</button>
<button id="zoom" aria-label="Phóng to bảng">🔍</button>

<div id="stage">
  <div class="anchor" id="boxwrap">
    <div id="tilt">
      <div class="body">
        <div class="f floor"></div>
        <div class="f fr"></div><div class="f bk"></div><div class="f lf"></div><div class="f rt"></div>
      </div>
      <div class="lid" id="lid">
        <div class="f fr"></div><div class="f bk"></div><div class="f lf"></div><div class="f rt"></div>
        <div class="f top"></div>
      </div>
    </div>
  </div>
  <div id="flash"></div>
  <div class="anchor"><div id="world"></div></div>
</div>
<div id="rose"><canvas id="rc"></canvas><div id="rtxt">Gửi tặng bạn một đóa hồng</div><button id="again">↻ Xem lại</button></div>
<div id="hint"><span>Chạm vào hộp quà để mở</span></div>

<script>
(function(){
const SYM="H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" ");
const MS="1.008 4.003 6.94 9.012 10.81 12.011 14.007 15.999 18.998 20.180 22.990 24.305 26.982 28.085 30.974 32.06 35.45 39.948 39.098 40.078 44.956 47.867 50.942 51.996 54.938 55.845 58.933 58.693 63.546 65.38 69.723 72.630 74.922 78.971 79.904 83.798 85.468 87.62 88.906 91.224 92.906 95.95 98 101.07 102.91 106.42 107.87 112.41 114.82 118.71 121.76 127.60 126.90 131.29 132.91 137.33 138.91 140.12 140.91 144.24 145 150.36 151.96 157.25 158.93 162.50 164.93 167.26 168.93 173.05 174.97 178.49 180.95 183.84 186.21 190.23 192.22 195.08 196.97 200.59 204.38 207.2 208.98 209 210 222 223 226 227 232.04 231.04 238.03 237 244 243 247 247 251 252 257 258 259 266 267 268 269 270 277 278 281 282 285 286 289 290 293 294 294".split(" ");
const CAT=[["Kim loại kiềm",355],["Kiềm thổ",22],["Kim loại chuyển tiếp",218],["Kim loại yếu",172],["Á kim",60],["Phi kim",140],["Halogen",100],["Khí hiếm",280],["Họ lantan",305],["Họ actini",332]];
const N=SYM.length,TAU=Math.PI*2,PER=14,LW=480;
const $=id=>document.getElementById(id);
const stage=$("stage"),world=$("world"),tilt=$("tilt"),lid=$("lid"),boxwrap=$("boxwrap"),flash=$("flash"),hint=$("hint"),bgm=$("bgm"),snd=$("snd"),zbtn=$("zoom"),big=$("big"),sub=$("sub");

function cell(z){
  if(z===1)return[1,1];if(z===2)return[18,1];
  if(z<=4)return[z-2,2];if(z<=10)return[z+8,2];
  if(z<=12)return[z-10,3];if(z<=18)return[z,3];
  if(z<=36)return[z-18,4];if(z<=54)return[z-36,5];
  if(z<=56)return[z-54,6];if(z<=70)return[z-54,8.7];
  if(z===71)return[3,6];if(z<=86)return[z-68,6];
  if(z<=88)return[z-86,7];if(z<=102)return[z-86,9.7];
  if(z===103)return[3,7];return[z-100,7];
}
function cat(z){
  const h=a=>a.indexOf(z)>-1;
  if(h([3,11,19,37,55,87]))return 0;
  if(h([4,12,20,38,56,88]))return 1;
  if(h([5,14,32,33,51,52]))return 4;
  if(h([1,6,7,8,15,16,34]))return 5;
  if(h([9,17,35,53,85,117]))return 6;
  if(h([2,10,18,36,54,86,118]))return 7;
  if(z>=57&&z<=71)return 8;
  if(z>=89&&z<=103)return 9;
  if((z>=21&&z<=30)||(z>=39&&z<=48)||(z>=72&&z<=80)||(z>=104&&z<=112))return 2;
  return 3;
}
const rnd=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const wrap=a=>a-TAU*Math.round(a/TAU);

const els=[],D=[],D2=[],A=[],cells=[],dec=[];
for(let i=0;i<N;i++){
  const z=i+1,h=CAT[cat(z)][1],e=document.createElement("div");
  e.className="el";
  e.style.background="hsla("+h+",75%,50%,.34)";
  e.style.border="1px solid hsla("+h+",90%,68%,.95)";
  e.innerHTML="<i>"+z+"</i><b>"+SYM[i]+"</b><u>"+MS[i]+"</u>";
  world.appendChild(e);
  els.push(e);D.push(rnd(i,1));D2.push(rnd(i,2));A.push(i*TAU/PER);cells.push(cell(z));
}
function mk(cls,html,c,r,leg){
  const d=document.createElement("div");d.className="dec "+cls;d.innerHTML=html;world.appendChild(d);
  dec.push({e:d,c:c,r:r,leg:leg});
}
for(let g=1;g<=18;g++)mk("lb",g,g,0);
for(let p=1;p<=7;p++)mk("lb",p,0,p);
mk("lg","<h4>Chu kì = hàng 1–7 · Nhóm = cột 1–18</h4><p>Trên: số hiệu · Giữa: ký hiệu · Dưới: khối lượng nguyên tử</p><div>"+
  CAT.map(c=>"<span><s style='background:hsl("+c[1]+",75%,50%)'></s>"+c[0]+"</span>").join("")+"</div>",7.5,2,1);

let W,H,cw,ch,asp,bw,bh,st,R,rs,off,zk,TX=[],TY=[],CY=[],OX=[],OY=[],OZ=[];
function layout(){
  W=innerWidth;H=innerHeight;
  const top=54,bot=44,avail=H-top-bot,chMax=avail/10.9,cwMax=(W-14)/19.3;
  cw=Math.min(cwMax,chMax*1.35);asp=Math.min(chMax/cw,1.6);ch=cw*asp;
  bw=Math.max(Math.min(W*.15,H*.74/(8.43*asp*1.1),60),cw);bh=bw*asp;st=cw/bw;
  R=PER*bw*1.18/TAU;rs=bh*1.1;off=(top-bot)/2;zk=cw<30?2.6:1.7;
  const f1=Math.min(bw*.4,bh*.36),f2=Math.min(bw*.19,bh*.17),f3=Math.min(bw*.17,bh*.16);
  for(let i=0;i<N;i++){
    const c=cells[i],e=els[i];
    TX[i]=(c[0]-9)*cw;TY[i]=(c[1]-4.85)*ch+off;CY[i]=(i/PER-4.2)*rs;
    OX[i]=(rnd(i,3)-.5)*W*.7;OY[i]=(rnd(i,4)-.5)*H*.5;OZ[i]=rnd(i,5)*bw*6;
    e.style.width=bw+"px";e.style.height=bh+"px";e.style.left=-bw/2+"px";e.style.top=-bh/2+"px";
    e.style.fontSize=f1+"px";e.children[0].style.fontSize=f2+"px";e.children[2].style.fontSize=f3+"px";
  }
  dec.forEach(d=>{
    const e=d.e;
    if(d.leg){const lh=LW*(3*ch)/(9.8*cw);e.style.width=LW+"px";e.style.height=lh+"px";e.style.left=-LW/2+"px";e.style.top=-lh/2+"px"}
    else{e.style.width=bw+"px";e.style.height=bh+"px";e.style.left=-bw/2+"px";e.style.top=-bh/2+"px";e.style.fontSize=Math.min(bw*.4,bh*.4)+"px"}
  });
  document.documentElement.style.setProperty("--s",Math.min(W*.5,H*.3,230)+"px");
  drawn=false;
}

let opened=false,revealing=false,ready=false,holding=false,finished=false,zoomOn=false;
let rt=0,t=0,theta=0,lastX=0,lastY=0,lastMove=0,drawn=false,settled=true;
let zt=1,zsm=1,px=0,py=0,ry=-25,rx=-22,boxT=0,gone=false,cd=10,cdTimer=null;

function showCd(){
  big.textContent=cd;big.classList.remove("tick");void big.offsetWidth;big.classList.add("tick");
  sub.textContent=cd>0?"Bất ngờ sau "+cd+" giây":"Bất ngờ đây!";
}
function startCd(){
  clearInterval(cdTimer);cd=10;showCd();
  cdTimer=setInterval(()=>{cd--;showCd();if(cd<=0){clearInterval(cdTimer);setTimeout(showRose,800)}},1000);
}
function open(){
  opened=true;
  try{bgm.volume=.85;const p=bgm.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  lid.classList.add("open");hint.classList.add("hide");
  setTimeout(()=>{flash.classList.add("on");revealing=true},750);
  setTimeout(()=>{boxwrap.classList.add("gone")},1500);
  setTimeout(()=>{gone=true},2500);
  setTimeout(()=>{
    ready=true;zbtn.classList.add("show");
    hint.firstChild.textContent="Chạm giữ & kéo để xoay cột";hint.classList.remove("hide");
    startCd();
  },3000);
}
stage.addEventListener("pointerdown",e=>{
  if(!opened){open();return}
  if(!ready||finished)return;
  holding=true;lastX=e.clientX;lastY=e.clientY;lastMove=performance.now();
  hint.classList.add("hide");
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
stage.addEventListener("pointermove",e=>{
  if(!holding)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;lastMove=performance.now();
  if(zoomOn){px+=dx;py+=dy}else theta+=dx*.014;
});
const release=()=>{holding=false};
stage.addEventListener("pointerup",release);
stage.addEventListener("pointercancel",release);
stage.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
zbtn.addEventListener("click",()=>{
  if(!ready||finished)return;
  zoomOn=!zoomOn;zt=zoomOn?zk:1;zbtn.classList.toggle("on",zoomOn);
});
let muted=false;
snd.addEventListener("click",()=>{
  muted=!muted;bgm.muted=muted;snd.textContent=muted?"🔇":"🔊";
  if(!muted&&opened&&bgm.paused){const p=bgm.play();if(p&&p.catch)p.catch(()=>{})}
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)bgm.pause();else if(opened&&!muted){const p=bgm.play();if(p&&p.catch)p.catch(()=>{})}
});
addEventListener("resize",()=>{layout();rsetup()});
addEventListener("orientationchange",()=>setTimeout(()=>{layout();rsetup()},250));

function draw(){
  const zs=zsm;
  const lx=Math.max(0,(19.3*cw*zs-W)/2+16),ly=Math.max(0,(10.9*ch*zs-H)/2+16);
  px=clamp(px,-lx,lx);py=clamp(py,-ly,ly);
  for(let i=0;i<N;i++){
    const p=ease(clamp((t-D[i]*.45)/.55,0,1));
    const ang=A[i]+theta,cx=Math.sin(ang)*R,cz=Math.cos(ang)*R,arc=Math.sin(Math.PI*p);
    const rr=ease(clamp((rt-D2[i]*.5)/.5,0,1));
    const tx=TX[i]*zs+px,ty=TY[i]*zs+py,s0=st*zs*.93;
    const x=(tx+(cx-tx)*p+OX[i]*arc)*rr,y=(ty+(CY[i]-ty)*p+OY[i]*arc)*rr,z=(cz*p+OZ[i]*arc)*rr;
    const s=(s0+(1-s0)*p)*rr;
    els[i].style.transform="translate3d("+x.toFixed(1)+"px,"+y.toFixed(1)+"px,"+z.toFixed(1)+"px) rotateY("+(wrap(ang)*p).toFixed(3)+"rad) scale("+s.toFixed(3)+")";
  }
  const fade=(1-clamp(t*5,0,1))*ease(clamp((rt-.5)/.5,0,1));
  for(let j=0;j<dec.length;j++){
    const d=dec[j],x=((d.c-9)*cw)*zs+px,y=((d.r-4.85)*ch+off)*zs+py;
    const k=d.leg?9.8*cw*zs/LW:st*zs;
    d.e.style.transform="translate3d("+x.toFixed(1)+"px,"+y.toFixed(1)+"px,0) scale("+k.toFixed(3)+")";
    d.e.style.opacity=fade.toFixed(2);
  }
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(roseOn)return;
  if(!gone){
    boxT+=dt;const k=1-Math.exp(-dt*4);
    ry+=((opened?-16:-25+Math.sin(boxT*1.3)*24)-ry)*k;rx+=((opened?-34:-22)-rx)*k;
    tilt.style.transform="translateY("+(Math.sin(boxT*2)*6).toFixed(1)+"px) rotateX("+rx.toFixed(1)+"deg) rotateY("+ry.toFixed(1)+"deg)";
  }
  if(revealing&&rt<1)rt=Math.min(1,rt+dt/1.8);
  const tgt=(holding&&ready&&!zoomOn)?1:0;
  if(t<tgt)t=Math.min(tgt,t+dt/1.4);else if(t>tgt)t=Math.max(tgt,t-dt/.9);
  const kz=1-Math.exp(-dt*8);
  zsm+=(zt-zsm)*kz;if(Math.abs(zt-zsm)<.003)zsm=zt;
  if(!zoomOn&&!holding){px+=-px*kz;py+=-py*kz;if(Math.abs(px)+Math.abs(py)<.5){px=0;py=0}}
  const home=Math.round(theta/TAU)*TAU;
  if(holding){
    settled=false;
    if(!zoomOn&&t>.6&&now-lastMove>500)theta+=dt*.7;
  }else{
    theta+=(home-theta)*(1-Math.exp(-dt*6));
    if(Math.abs(theta-home)<.002){theta=home;settled=true}else settled=false;
  }
  const idle=!revealing?true:(rt>=1&&t===0&&!holding&&settled&&zsm===zt&&(zoomOn||(px===0&&py===0)));
  if(idle&&drawn)return;
  draw();drawn=idle;
}

/* ================= MÀN HÌNH BÔNG HỒNG (tự vẽ bằng canvas) ================= */
const rose=$("rose"),cv=$("rc"),g=cv.getContext("2d"),rtxt=$("rtxt"),again=$("again");
let roseOn=false,RW,RH,dpr,FR,CX,CYr,bt=0,rl=0,petals=[],fall=[],spark=[],cache=null;
function rsetup(){
  dpr=Math.min(2,devicePixelRatio||1);RW=innerWidth;RH=innerHeight;
  cv.width=RW*dpr;cv.height=RH*dpr;cache=null;
  FR=Math.min(RW*.235,RH*.135);CX=RW/2;CYr=RH*.37;
  const NL=[3,4,5,6,7,8],RR=[.03,.14,.28,.45,.62,.8],WW=[.27,.31,.35,.39,.43,.46],HH=[.5,.6,.7,.8,.9,1];
  petals=[];
  for(let L=0;L<6;L++)for(let i=0;i<NL[L];i++)
    petals.push({L:L,a:L*.85+i*TAU/NL[L]+(rnd(L*9+i,7)-.5)*.35,r:RR[L]*FR,w:WW[L]*FR*(.92+rnd(i,L)*.16),h:HH[L]*FR*(.92+rnd(L,i+3)*.16)});
  petals.sort((a,b)=>b.L-a.L);
  fall=[];for(let i=0;i<20;i++)fall.push({x:rnd(i,11)*RW,y:-rnd(i,12)*RH,vy:22+rnd(i,13)*34,ph:rnd(i,14)*6,rot:rnd(i,15)*6,vr:(rnd(i,16)-.5)*2,s:FR*(.09+rnd(i,17)*.07)});
  spark=[];for(let i=0;i<40;i++)spark.push({x:rnd(i,21)*RW,y:rnd(i,22)*RH,ph:rnd(i,23)*6,r:.8+rnd(i,24)*1.8});
}
function petalPath(c,w,h){
  c.beginPath();c.moveTo(0,0);
  c.bezierCurveTo(-w*1.15,-h*.2,-w*1.05,-h*.95,-w*.3,-h*.99);
  c.quadraticCurveTo(0,-h*1.1,w*.3,-h*.99);
  c.bezierCurveTo(w*1.05,-h*.95,w*1.15,-h*.2,0,0);c.closePath();
}
function drawPetal(c,x,y,rot,w,h,tone){
  c.save();c.translate(x,y);c.rotate(rot);
  petalPath(c,w,h);c.lineWidth=h*.07;c.strokeStyle="rgba(30,0,8,.32)";c.stroke(); // bóng đổ giả
  const gr=c.createLinearGradient(0,0,0,-h);
  gr.addColorStop(0,"hsl(348,85%,"+(10+tone*6)+"%)");gr.addColorStop(.45,"hsl(350,80%,"+(26+tone*9)+"%)");gr.addColorStop(1,"hsl(352,88%,"+(46+tone*12)+"%)");
  c.fillStyle=gr;c.fill();
  c.save();c.clip();
  c.strokeStyle="rgba(50,0,14,.28)";c.lineWidth=h*.011;
  for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(k*w*.35,-h*.5,k*w*.5,-h*.97);c.stroke()}
  const hl=c.createRadialGradient(0,-h*.97,0,0,-h*.97,w*.95);
  hl.addColorStop(0,"rgba(255,200,208,.42)");hl.addColorStop(1,"rgba(255,200,208,0)");
  c.fillStyle=hl;c.fillRect(-w*1.3,-h*1.2,w*2.6,h*1.3);
  c.restore();
  petalPath(c,w,h);c.lineWidth=h*.022;c.strokeStyle="rgba(255,170,185,.5)";c.stroke();
  c.restore();
}
function leaf(c,x,y,ang,len){
  c.save();c.translate(x,y);c.rotate(ang);
  c.beginPath();c.moveTo(0,0);c.bezierCurveTo(len*.25,-len*.34,len*.7,-len*.32,len,0);c.bezierCurveTo(len*.7,len*.3,len*.25,len*.34,0,0);
  const gr=c.createLinearGradient(0,-len*.3,0,len*.3);gr.addColorStop(0,"#2f8a3c");gr.addColorStop(1,"#0c3d1c");
  c.fillStyle=gr;c.fill();c.lineWidth=len*.012;c.strokeStyle="rgba(190,255,190,.45)";c.stroke();
  c.beginPath();c.moveTo(0,0);c.lineTo(len*.95,0);c.stroke();
  c.lineWidth=len*.008;c.strokeStyle="rgba(190,255,190,.3)";
  for(let k=1;k<=5;k++){const xx=len*k*.15;c.beginPath();c.moveTo(xx,0);c.lineTo(xx+len*.13,-len*.15*(1-k*.1));c.moveTo(xx,0);c.lineTo(xx+len*.13,len*.15*(1-k*.1));c.stroke()}
  c.restore();
}
function scene(c,prog){
  const y0=CYr+FR*.5,y1=RH*1.02,cxs=CX-FR*.35;
  const halo=c.createRadialGradient(CX,CYr,FR*.2,CX,CYr,FR*2.3);
  halo.addColorStop(0,"rgba(255,60,100,"+(.3*prog)+")");halo.addColorStop(1,"rgba(255,60,100,0)");
  c.fillStyle=halo;c.fillRect(0,0,RW,RH);
  // thân
  const sg=c.createLinearGradient(0,y0,0,y1);sg.addColorStop(0,"#3fa04a");sg.addColorStop(1,"#0d3f1d");
  c.strokeStyle=sg;c.lineCap="round";c.lineWidth=Math.max(5,FR*.085);
  c.beginPath();c.moveTo(CX,y0);c.quadraticCurveTo(cxs,(y0+y1)*.55,CX+FR*.12,y1);c.stroke();
  const P=t=>[(1-t)*(1-t)*CX+2*(1-t)*t*cxs+t*t*(CX+FR*.12),(1-t)*(1-t)*y0+2*(1-t)*t*(y0+y1)*.55+t*t*y1];
  const lp=clamp(prog*1.6-.3,0,1);
  let q=P(.42);leaf(c,q[0],q[1],-.5-.25*(1-lp),FR*1.05*lp);
  q=P(.66);leaf(c,q[0],q[1],Math.PI+.5+.25*(1-lp),FR*1.2*lp);
  c.fillStyle="#2a7a37";
  [.22,.5,.78].forEach((t,i)=>{q=P(t);const d=i%2?-1:1;c.beginPath();c.moveTo(q[0],q[1]-FR*.06);c.lineTo(q[0]+d*FR*.14,q[1]+FR*.01);c.lineTo(q[0],q[1]+FR*.05);c.fill()});
  // đài hoa
  for(let k=0;k<5;k++){const a=k*TAU/5+.3;c.save();c.translate(CX,CYr);c.rotate(a);petalPath(c,FR*.14,FR*1.08*ease(clamp(prog*3,0,1)));c.fillStyle="#1f6a2e";c.fill();c.restore()}
  // cánh hoa
  for(const p of petals){
    const o=ease(clamp((prog-p.L*.11)/.45,0,1));if(o<=0)continue;
    drawPetal(c,CX+Math.sin(p.a)*p.r*o,CYr-Math.cos(p.a)*p.r*o,p.a+(1-o)*.35,p.w*(.25+.75*o),p.h*(.25+.75*o),p.L/5);
  }
  // xoáy nhụy ở tâm
  const o=ease(clamp(prog*2,0,1));
  for(let s=0;s<2;s++){
    c.beginPath();
    for(let a=0;a<4*Math.PI;a+=.2){const r=a*FR*.017*o,xx=CX+Math.cos(a+s*3.14)*r,yy=CYr+Math.sin(a+s*3.14)*r*.9;a?c.lineTo(xx,yy):c.moveTo(xx,yy)}
    c.strokeStyle=s?"rgba(255,150,170,.28)":"rgba(25,0,8,.5)";c.lineWidth=FR*.018;c.stroke();
  }
  // giọt sương
  if(prog>.9)[[.35,-.5,.03],[-.55,-.15,.022],[.1,.55,.026]].forEach(d=>{
    const xx=CX+d[0]*FR,yy=CYr+d[1]*FR,r=FR*d[2];
    const dg=c.createRadialGradient(xx-r*.3,yy-r*.3,0,xx,yy,r);dg.addColorStop(0,"rgba(255,255,255,.9)");dg.addColorStop(1,"rgba(255,170,190,.15)");
    c.fillStyle=dg;c.beginPath();c.arc(xx,yy,r,0,TAU);c.fill();
  });
}
function rloop(now){
  if(!roseOn)return;
  requestAnimationFrame(rloop);
  const dt=Math.min(.05,(now-rl)/1000);rl=now;bt+=dt;
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,RW,RH);
  const prog=clamp(bt/3.6,0,1);
  if(prog<1)scene(g,prog);
  else{
    if(!cache){cache=document.createElement("canvas");cache.width=cv.width;cache.height=cv.height;const cg=cache.getContext("2d");cg.setTransform(dpr,0,0,dpr,0,0);scene(cg,1)}
    g.save();g.translate(CX,RH);g.rotate(Math.sin(bt*.8)*.012);g.translate(-CX,-RH);g.drawImage(cache,0,0,RW,RH);g.restore();
  }
  for(const s of spark){g.fillStyle="rgba(255,225,150,"+(.5+.5*Math.sin(bt*2+s.ph))*.8+")";g.beginPath();g.arc(s.x,s.y,s.r,0,TAU);g.fill()}
  if(prog>.5)for(const f of fall){
    f.y+=f.vy*dt;f.x+=(Math.sin(bt+f.ph)*22)*dt;f.rot+=f.vr*dt;
    if(f.y>RH+30){f.y=-30;f.x=rnd(f.ph*9,31)*RW}
    g.save();g.translate(f.x,f.y);g.rotate(f.rot);g.scale(1,.35+.65*Math.abs(Math.cos(bt*1.5+f.ph)));
    petalPath(g,f.s*.5,f.s);g.fillStyle="rgba(210,25,60,.85)";g.fill();g.restore();
  }
  if(bt>3.8){rtxt.classList.add("show");again.classList.add("show")}
}
function showRose(){
  finished=true;holding=false;roseOn=true;bt=0;rl=performance.now();
  rose.classList.add("on");requestAnimationFrame(rloop);
}
again.addEventListener("click",()=>{
  roseOn=false;finished=false;rose.classList.remove("on");rtxt.classList.remove("show");again.classList.remove("show");
  drawn=false;startCd();
});

layout();rsetup();
requestAnimationFrame(frame);
})();
</script>
